<!-- Public Layout: Für nicht eingeloggte User (Landing Page) -->
<div class="min-h-screen grid grid-rows-[auto_1fr_auto] grid-cols-1">
  <!-- Header -->
  <header class="bg-amber-500 text-white shadow-lg z-20">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold cursor-pointer" routerLink="/">StaxmedOS</h1>
      <nav>
        <ul class="flex space-x-6">
          <li>
            <button
              (click)="openModal($event)"
              class="font-bold border-2 border-white px-4 py-1 rounded-lg hover:bg-white hover:text-amber-500 transition"
            >
              Login
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content (Full Width) -->
  <main class="bg-gray-50">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-4 text-center text-sm border-t border-gray-700">
    <p>&copy; 2026 StaxmedOS - Intelligente Medizinlogistik</p>
  </footer>

  <!-- Login Modal -->
  <app-auth-modal></app-auth-modal>
</div>
