<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Mandantenverwaltung (StaxAdmin)</h2>
    <button class="bg-amber-500 text-white px-4 py-2 rounded-lg hover:bg-amber-600 transition">
      + Neuer Mandant
    </button>
  </div>

  <div class="bg-white shadow-md rounded-xl overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
        <tr>
          <th class="p-4 border-b">Organisation</th>
          <th class="p-4 border-b">Status</th>
          <th class="p-4 border-b">Plan</th>
          <th class="p-4 border-b text-right">Aktionen</th>
        </tr>
      </thead>
      <tbody>
        @for (tenant of tenants(); track tenant.id) {
          <tr class="hover:bg-gray-50 transition">
            <td class="p-4 border-b font-medium">{{ tenant.name }}</td>
            <td class="p-4 border-b">
              <span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">
                {{ tenant.status }}
              </span>
            </td>
            <td class="p-4 border-b text-gray-600">{{ tenant.plan_name || 'Kein Plan' }}</td>
            <td class="p-4 border-b text-right">
              <button class="text-amber-600 hover:underline mr-3">Edit</button>
              <button class="text-gray-400 hover:text-red-500">Archive</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
