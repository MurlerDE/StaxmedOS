@if (showAlert()) {
  <app-alert [color]="alertColor()">{{ alertMsg() }}</app-alert>
}

<form #loginForm="ngForm" (ngSubmit)="login()">
  <!-- Email -->
  <div class="mb-3">
    <label class="inline-block mb-2">Email</label>
    <input
      type="email"
      class="block w-full py-1.5 px-3 text-gray-600 border border-gray-400 transition duration-500 focus:outline-none rounded bg-transparent focus:border-indigo-400"
      name="email"
      placeholder="E-Mail/Nutzername"
      [(ngModel)]="credentials.username"
      required
      #email="ngModel"
    />
    @if (email.errors && email.touched && email.dirty) {
      <p class="text-red-400">E-Mail nicht gültig.</p>
    }
  </div>
  <!-- Passwort -->
  <div class="mb-3">
    <label class="inline-block mb-2">Passwort</label>
    <input
      type="password"
      class="block w-full py-1.5 px-3 text-gray-600 border border-gray-400 transition duration-500 focus:outline-none rounded bg-transparent focus:border-indigo-400"
      name="password"
      placeholder="Passwort"
      [(ngModel)]="credentials.password"
      required
      #password="ngModel"
    />
    @if (password.errors && password.touched && password.dirty) {
      <p class="text-red-400">Passwort ist falsch.</p>
    }
  </div>
  <button
    [disabled]="!loginForm.valid || inSubmission()"
    type="submit"
    class="block w-full bg-amber-400 text-white py-1.5 px-3 rounded transition hover:bg-amber-500 disabled:opacity-50 disabled:bg-amber-400"
  >
    Anmelden
  </button>
</form>
