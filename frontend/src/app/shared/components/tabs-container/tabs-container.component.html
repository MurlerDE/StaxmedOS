<nav class="flex flex-nowrap mb-4 text-center">
  @for (tab of tabs(); track $index) {
    <a
      class="block w-full rounded py-3 px-4 transition hover:text-white text-black"
      href="#"
      (click)="selectTab(tab)"
      [ngClass]="{
        'hover:text-gray-300': !tab.active(),
        'hover:text-white bg-amber-400': tab.active(),
      }"
      >{{ tab.tabTitle() }}</a
    >
  }
</nav>
<ng-content></ng-content>
